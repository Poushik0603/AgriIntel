server:
  port: 8086

spring:
  application:
    name: insight-service
  ai:
    openai:
      base-url: ${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${NVIDIA_NIM_API_KEY:}
      chat:
        options:
          model: ${NVIDIA_NIM_MODEL:nvidia/nemotron-3-ultra-550b-a55b}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka}
