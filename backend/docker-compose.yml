services:
  service-registry:
    build: ./service-registry
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    depends_on:
      - service-registry
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    ports:
      - "8090:8090"

  weather-service:
    build: ./weather-service
    depends_on:
      - service-registry
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
    ports:
      - "8083:8083"

  ml-crop-service:
    build: ./ml-crop-service
    ports:
      - "8000:8000"

  crop-service:
    build: ./crop-service
    depends_on:
      - service-registry
      - weather-service
      - mysql-crop
      - ml-crop-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      DB_HOST: mysql-crop
      DB_NAME: crop_db
      DB_USERNAME: root
      DB_PASSWORD: root
      ML_CROP_SERVICE_URL: http://ml-crop-service:8000
    ports:
      - "8081:8081"

  ml-price-service:
    build: ./ml-price-service
    ports:
      - "8001:8000"

  mysql-user:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql

  mysql-price:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: price_db
    ports:
      - "3308:3306"
    volumes:
      - price_mysql_data:/var/lib/mysql

  mysql-market:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: market_db
    ports:
      - "3309:3306"
    volumes:
      - market_mysql_data:/var/lib/mysql

  mysql-crop:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crop_db
    ports:
      - "3310:3306"
    volumes:
      - crop_mysql_data:/var/lib/mysql

  user-service:
    build: ./user-service
    depends_on:
      - service-registry
      - mysql-user
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      DB_HOST: mysql-user
      DB_NAME: user_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8084:8084"

  price-service:
    build: ./price-service
    depends_on:
      - service-registry
      - mysql-price
      - ml-price-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      DB_HOST: mysql-price
      DB_NAME: price_db
      DB_USERNAME: root
      DB_PASSWORD: root
      ML_PRICE_SERVICE_URL: http://ml-price-service:8000
    ports:
      - "8082:8082"

  market-data-service:
    build: ./market-data-service
    depends_on:
      - service-registry
      - mysql-market
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      DB_HOST: mysql-market
      DB_NAME: market_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8085:8085"

  insight-service:
    build: ./insight-service
    depends_on:
      - service-registry
      - weather-service
      - crop-service
      - price-service
      - market-data-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    ports:
      - "8086:8086"

  mysql-scenario:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scenario_db
    ports:
      - "3311:3306"
    volumes:
      - scenario_mysql_data:/var/lib/mysql

  scenario-service:
    build: ./scenario-service
    depends_on:
      - service-registry
      - mysql-scenario
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      DB_HOST: mysql-scenario
      DB_NAME: scenario_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8087:8087"

volumes:
  user_mysql_data:
  price_mysql_data:
  market_mysql_data:
  crop_mysql_data:
  scenario_mysql_data:
