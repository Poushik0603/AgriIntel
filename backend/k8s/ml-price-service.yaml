apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-price-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-price-service
  template:
    metadata:
      labels:
        app: ml-price-service
    spec:
      containers:
        - name: ml-price-service
          image: agriintel-ml-price-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ml-price-service
spec:
  selector:
    app: ml-price-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
