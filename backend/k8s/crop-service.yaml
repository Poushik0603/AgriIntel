apiVersion: apps/v1
kind: Deployment
metadata:
  name: crop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crop-service
  template:
    metadata:
      labels:
        app: crop-service
    spec:
      containers:
        - name: crop-service
          image: agriintel-crop-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka
            - name: DB_HOST
              value: mysql-crop
            - name: DB_NAME
              value: crop_db
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: root
            - name: ML_CROP_SERVICE_URL
              value: http://ml-crop-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: crop-service
spec:
  selector:
    app: crop-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
