server:
  port: 8087

spring:
  application:
    name: scenario-service
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-scenario}:${DB_PORT:3306}/${DB_NAME:scenario_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka}
